<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Overall Game Flow</title>
  <desc id="desc">A flow diagram showing the player's path from the main menu through four LLM learning levels and the final demo.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .small { font: 400 15px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .side { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="58" text-anchor="middle">Overall Game Flow</text>
  <text class="subtitle" x="640" y="88" text-anchor="middle">LLM Go guides players through a progressive learning path from menu to final demonstration.</text>

  <rect class="box" x="70" y="170" width="170" height="90" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="155" y="205" text-anchor="middle">Main Menu</text>
  <text class="small" x="155" y="233" text-anchor="middle">Start / Knowledge</text>

  <rect class="box" x="305" y="155" width="190" height="120" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="400" y="192" text-anchor="middle">Level 1</text>
  <text class="small" x="400" y="222" text-anchor="middle">Tokenization</text>
  <text class="small" x="400" y="246" text-anchor="middle">ID Mapping</text>

  <rect class="box" x="560" y="155" width="190" height="120" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="655" y="192" text-anchor="middle">Level 2</text>
  <text class="small" x="655" y="222" text-anchor="middle">Embedding</text>
  <text class="small" x="655" y="246" text-anchor="middle">Self-Attention</text>

  <rect class="box" x="815" y="155" width="190" height="120" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="910" y="192" text-anchor="middle">Level 3</text>
  <text class="small" x="910" y="222" text-anchor="middle">Word Relations</text>
  <text class="small" x="910" y="246" text-anchor="middle">Semantics</text>

  <rect class="box" x="1070" y="155" width="170" height="120" fill="#fee2e2" stroke="#dc2626"/>
  <text class="label" x="1155" y="192" text-anchor="middle">Level 4</text>
  <text class="small" x="1155" y="222" text-anchor="middle">FFN Features</text>
  <text class="small" x="1155" y="246" text-anchor="middle">Output</text>

  <path class="arrow" d="M240 215 H292"/>
  <path class="arrow" d="M495 215 H547"/>
  <path class="arrow" d="M750 215 H802"/>
  <path class="arrow" d="M1005 215 H1057"/>

  <rect class="box" x="470" y="405" width="340" height="95" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="640" y="443" text-anchor="middle">Final Demonstration</text>
  <text class="small" x="640" y="473" text-anchor="middle">Complete gameplay and integrated learning experience</text>

  <path class="arrow" d="M1155 275 C1155 365 830 380 710 405"/>

  <rect class="box" x="95" y="405" width="250" height="95" fill="#f1f5f9" stroke="#64748b"/>
  <text class="label" x="220" y="443" text-anchor="middle">Support Menus</text>
  <text class="small" x="220" y="473" text-anchor="middle">Knowledge / Settings / Exit</text>

  <path class="arrow side" d="M155 260 C145 330 165 370 210 405"/>
  <path class="arrow side" d="M345 452 H457"/>
</svg>
