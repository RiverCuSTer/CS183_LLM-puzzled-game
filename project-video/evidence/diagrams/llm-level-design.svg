<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLM Learning Level Design</title>
  <desc id="desc">A diagram mapping LLM text-processing concepts to four interactive game levels.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .stage { stroke-width: 2; rx: 12; }
      .level { font: 700 18px Arial, sans-serif; fill: #111827; }
      .concept { font: 700 21px Arial, sans-serif; fill: #111827; }
      .detail { font: 400 15px Arial, sans-serif; fill: #374151; }
      .pipe { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="58" text-anchor="middle">LLM Learning Level Design</text>
  <text class="subtitle" x="640" y="88" text-anchor="middle">Each level turns one part of the LLM text-processing pipeline into a playable puzzle.</text>

  <rect class="band" x="80" y="145" width="1120" height="395"/>

  <rect class="stage" x="120" y="205" width="210" height="250" fill="#dcfce7" stroke="#16a34a"/>
  <text class="level" x="225" y="240" text-anchor="middle">Level 1</text>
  <text class="concept" x="225" y="282" text-anchor="middle">Token + ID</text>
  <text class="detail" x="225" y="325" text-anchor="middle">split text</text>
  <text class="detail" x="225" y="351" text-anchor="middle">match symbols</text>
  <text class="detail" x="225" y="377" text-anchor="middle">build mapping</text>

  <rect class="stage" x="390" y="205" width="210" height="250" fill="#fef3c7" stroke="#d97706"/>
  <text class="level" x="495" y="240" text-anchor="middle">Level 2</text>
  <text class="concept" x="495" y="282" text-anchor="middle">Attention</text>
  <text class="detail" x="495" y="325" text-anchor="middle">balance weights</text>
  <text class="detail" x="495" y="351" text-anchor="middle">connect inputs</text>
  <text class="detail" x="495" y="377" text-anchor="middle">observe focus</text>

  <rect class="stage" x="660" y="205" width="210" height="250" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="level" x="765" y="240" text-anchor="middle">Level 3</text>
  <text class="concept" x="765" y="282" text-anchor="middle">Semantics</text>
  <text class="detail" x="765" y="325" text-anchor="middle">match relations</text>
  <text class="detail" x="765" y="351" text-anchor="middle">arrange meaning</text>
  <text class="detail" x="765" y="377" text-anchor="middle">complete layers</text>

  <rect class="stage" x="930" y="205" width="210" height="250" fill="#fee2e2" stroke="#dc2626"/>
  <text class="level" x="1035" y="240" text-anchor="middle">Level 4</text>
  <text class="concept" x="1035" y="282" text-anchor="middle">FFN Output</text>
  <text class="detail" x="1035" y="325" text-anchor="middle">select features</text>
  <text class="detail" x="1035" y="351" text-anchor="middle">combine signals</text>
  <text class="detail" x="1035" y="377" text-anchor="middle">produce result</text>

  <path class="pipe" d="M330 330 H376"/>
  <path class="pipe" d="M600 330 H646"/>
  <path class="pipe" d="M870 330 H916"/>

  <text class="subtitle" x="640" y="610" text-anchor="middle">Learning path: text input -> representation -> attention -> semantic understanding -> feature processing -> output</text>
</svg>
